[project]
name = "data-agent"
version = "0.1.0"
description = "Agente de IA data-aware sobre o Olist Brazilian E-Commerce Dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "duckdb",
    "python-dotenv",
    "langfuse",
    "openinference-instrumentation-agno",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "structlog",
    "sqlglot>=30.18.0",
    "openai>=3.13.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PL"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 95

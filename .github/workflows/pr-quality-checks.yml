name: PR Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run mypy src scripts

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run bandit -r src -ll

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - name: Write mocked test .env
        run: |
          cat <<'EOF' > .env
          OPENAI_API_KEY=test_key
          LANGFUSE_PUBLIC_KEY=test_public_key
          LANGFUSE_SECRET_KEY=test_secret_key
          LANGFUSE_HOST=http://localhost:3000
          DUCKDB_PATH=data/warehouse.duckdb
          EOF
      - run: uv run pytest --cov=src --cov-report=term-missing

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, security-check, tests]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Build summary
        id: build
        run: |
          lint_result="${{ needs.lint.result }}"
          type_check_result="${{ needs.type-check.result }}"
          security_check_result="${{ needs.security-check.result }}"
          tests_result="${{ needs.tests.result }}"

          to_emoji() {
            if [ "$1" = "success" ]; then echo "✅"; else echo "❌"; fi
          }

          {
            echo "## PR Quality Checks Summary"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Lint | $(to_emoji "$lint_result") |"
            echo "| Type Check | $(to_emoji "$type_check_result") |"
            echo "| Security Check | $(to_emoji "$security_check_result") |"
            echo "| Tests | $(to_emoji "$tests_result") |"
          } > summary.md

          cat summary.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$lint_result" != "success" ] || [ "$type_check_result" != "success" ] || \
             [ "$security_check_result" != "success" ] || [ "$tests_result" != "success" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if any check failed
        if: steps.build.outputs.failed == 'true'
        run: exit 1
